name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Also publish the Windows ZIP and EXE installer to Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node for updater tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read application version
        id: metadata
        run: |
          $package = Get-Content ai-fusion-video-web/package.json -Raw | ConvertFrom-Json
          if ($package.version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'This Windows workflow requires a stable three-part application version'
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Test update and rollback transactions
        run: node --test windows/transaction.test.mjs

      - name: Build portable Windows application
        run: |
          ./windows/bundle.ps1 `
            -Destination "$env:RUNNER_TEMP/FusionVideo-Windows-x64" `
            -Cache "$env:RUNNER_TEMP/fusion-toolchain"

      - name: Package clean application and verify ZIP
        run: |
          ./windows/ci-package.ps1 `
            -Bundle "$env:RUNNER_TEMP/FusionVideo-Windows-x64" `
            -OutDir "$env:GITHUB_WORKSPACE/dist"

      - name: Build EXE installer
        run: |
          ./windows/ci-installer.ps1 `
            -Bundle "$env:RUNNER_TEMP/FusionVideo-Windows-x64" `
            -OutDir "$env:GITHUB_WORKSPACE/dist"

      - name: Verify desktop window, shutdown, reinstall and data preservation
        run: |
          ./windows/ci-installer-smoke.ps1 `
            -OutDir "$env:GITHUB_WORKSPACE/dist" `
            -InstallDir "$env:RUNNER_TEMP/FusionVideo-Installed"

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: FusionVideo-Windows-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@v4
        with:
          name: FusionVideo-Windows-x64
          path: dist

      - name: Publish to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = 'windows-v{0}-{1}.{2}' -f $env:APP_VERSION, $env:GITHUB_RUN_NUMBER, $env:GITHUB_RUN_ATTEMPT
          $zip = "dist/FusionVideo-Windows-x64-$env:APP_VERSION.zip"
          $installer = "dist/FusionVideo-Windows-x64-$env:APP_VERSION-Setup.exe"
          $notes = Join-Path $env:RUNNER_TEMP 'windows-release-notes.md'
          @"
          Windows x64 standalone desktop application $env:APP_VERSION (Windows wrapper 2).
          Source commit: $env:GITHUB_SHA
          Run the Setup.exe installer, then open the FusionVideo shortcut.
          The app opens in its own desktop window and does not require an external browser.
          Portable ZIP: extract to an English path without spaces and run FusionVideo.exe.
          Close the desktop window to stop local services.
          A previously uninstalled folder can be reinstalled while retaining its configuration and data.
          Uninstalling keeps generated configuration and user data.
          Update.cmd in this package uses the upstream source-build update channel.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create $tag $zip $installer dist/SHA256SUMS.txt dist/build-manifest.json `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Windows $env:APP_VERSION ($env:GITHUB_RUN_NUMBER)" `
            --notes-file $notes --latest=false
          if ($LASTEXITCODE -ne 0) {
            throw 'Publishing the Windows release failed'
          }
